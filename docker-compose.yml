# ─────────────────────────────────────────────────────
# ZF Solution — Docker Compose (Local Production Sim)
# ─────────────────────────────────────────────────────
# Usage:
#   docker compose up --build     (start all services)
#   docker compose down -v        (stop + remove volumes)
# ─────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
